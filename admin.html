<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="MOAR menü yönetim paneli — fiyat, menü, iletişim ve saatleri düzenle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap">
<title>MOAR Yönetim</title>
<style>
  :root{
    --bg:#F3F0E8; --surface:#FFFFFF; --soft:#F6F2E9; --ink:#1A2B28; --muted:#5E6E6A;
    --sea:#0C6E68; --amber:#C9792A; --line:#E3DBCC; --red:#C0493A; --green:#17A85f;
    --font-display:"Bricolage Grotesque",system-ui,sans-serif; --font-body:"Hanken Grotesk",system-ui,sans-serif; --font-mono:"Spline Sans Mono",ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0D1F22; --surface:#122B2F; --soft:#0F2429; --ink:#EAE3D4; --muted:#92A6A1; --sea:#34B7AC; --amber:#EBA459; --line:#204145; color-scheme:dark;}}
  :root[data-theme="dark"]{--bg:#0D1F22; --surface:#122B2F; --soft:#0F2429; --ink:#EAE3D4; --muted:#92A6A1; --sea:#34B7AC; --amber:#EBA459; --line:#204145; color-scheme:dark;}
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font-body);line-height:1.5;-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sea);outline-offset:2px}

  .top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px 16px}
  .top .logo{font-family:var(--font-display);font-weight:800;font-size:18px} .logo .o{color:var(--sea)}
  .top .tag{font-family:var(--font-mono);font-size:10px;color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);padding:2px 7px;border-radius:999px;text-transform:uppercase}
  .top .sp{margin-left:auto}
  .ok{color:var(--green);font-weight:700;font-size:14px}
  .link{color:var(--sea);text-decoration:none;font-weight:600;font-size:14px}
  .theme{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}

  .wrap{max-width:660px;margin:0 auto;width:100%;padding:18px 16px 70px}
  .lock{max-width:340px;margin:12vh auto;text-align:center;padding:0 16px}
  .lock h1{font-family:var(--font-display);font-size:22px;margin:0 0 6px}
  .lock p{color:var(--muted);font-size:13.5px;margin:0 0 16px}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .card h2{font-family:var(--font-display);font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .fld{display:block;margin-bottom:10px}
  .fld>span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
  .inp{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 10px}
  textarea.inp{min-height:90px;resize:vertical;font-family:var(--font-mono);font-size:12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .hrow{display:grid;grid-template-columns:96px 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:6px;font-size:13px}
  .hrow .day{color:var(--muted)}
  .irow{display:grid;grid-template-columns:1fr 76px auto;gap:6px;margin-bottom:6px;align-items:center}
  .irow .sub{grid-column:1/-1;display:grid;grid-template-columns:1fr 120px;gap:6px}
  .mini{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
  .mini.x{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line));padding:6px 9px}
  .msec{border:1px dashed var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .msec .secttl{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px}
  .chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:12px}
  .btns{display:flex;flex-wrap:wrap;gap:8px}
  .abtn{font:inherit;font-weight:700;font-size:14px;border:1px solid var(--line);border-radius:11px;padding:10px 15px;cursor:pointer;background:var(--bg);color:var(--ink)}
  .abtn.go{background:var(--sea);color:#fff;border-color:var(--sea)}
  .note{font-size:12.5px;color:var(--muted);background:color-mix(in srgb,var(--amber) 12%,var(--bg));border:1px solid color-mix(in srgb,var(--amber) 30%,var(--line));border-radius:10px;padding:10px 12px;margin-bottom:16px}
  .err{color:var(--red);font-size:13px;margin-top:8px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <span class="logo">M<span class="o">O</span>AR</span><span class="tag">Yönetim</span>
  <span class="sp"></span>
  <span class="ok" id="savedMsg" hidden>✓ Kaydedildi</span>
  <a class="link" id="siteLink" href="index.html" target="_blank" rel="noopener">Siteyi aç ↗</a>
  <button class="theme" id="theme" aria-label="Theme">◐</button>
</div>

<div id="lock" class="lock">
  <h1>Yönetici girişi</h1>
  <p>Menüyü düzenlemek için şifre girin.<br>(Varsayılan: <b>moar1234</b>)</p>
  <input class="inp" id="pass" type="password" autocomplete="off" placeholder="••••" style="text-align:center;max-width:200px;margin:0 auto 12px">
  <div><button class="abtn go" id="go">Giriş</button></div>
  <p class="err" id="err" hidden>Şifre yanlış.</p>
</div>

<div id="editor" class="wrap" hidden></div>

<script>
(function(){
  var DEFAULTS = {
    config:{brand:"MOAR", phone:"+90 533 884 46 69", whatsapp:"905338848469",
      mapsUrl:"https://maps.google.com/?cid=1268164831994089043", currency:"₺",
      address:{tr:"Necdet Levent Cd, Gemikonağı — Lefke", en:"Necdet Levent Cd, Gemikonağı — Lefke, N. Cyprus", ru:"Неджет Левент дж., Гемиконагы — Лефке"},
      hoursConfirmed:true,
      hours:{0:{o:480,c:1440},1:{o:480,c:1440},2:{o:480,c:1440},3:{o:480,c:1440},4:{o:480,c:1440},5:{o:480,c:1440},6:{o:480,c:1440}},
      adminPass:"moar1234"},
    signature:{title:"Kruvasan & Flat White", desc:"Günün favorisi — taze tereyağlı kruvasan, yanında sütlü flat white.", price:"185"},
    menu:[
      {id:"kahve",title:"Kahve",sub:"sıcak · espresso bazlı",items:[{name:"Espresso",desc:"tek / duble",price:"70"},{name:"Americano",price:"85"},{name:"Flat White",price:"110",tag:"POPÜLER"},{name:"Cappuccino",price:"110"},{name:"Latte",desc:"vanilya / fındık +15",price:"115"},{name:"Cortado",price:"95"},{name:"Türk Kahvesi",price:"80"},{name:"Mocha",price:"125"}]},
      {id:"soguk",title:"Soğuk",sub:"buzlu · serinletici",items:[{name:"Iced Latte",price:"120"},{name:"Cold Brew",price:"130",tag:"YENİ"},{name:"Iced Americano",price:"95"},{name:"Frappe",price:"115"},{name:"Ev Limonatası",desc:"nane & limon",price:"90"},{name:"Milkshake",desc:"çikolata / çilek",price:"140"}]},
      {id:"pastane",title:"Pastane",sub:"taze fırın",items:[{name:"Tereyağlı Kruvasan",price:"95"},{name:"Çikolatalı Kruvasan",price:"110"},{name:"San Sebastian",price:"160",tag:"FAVORİ"},{name:"Cheesecake",desc:"orman meyveli",price:"150"},{name:"Cookie",price:"70"},{name:"Muffin",price:"85"}]},
      {id:"tabak",title:"Tabaklar",sub:"kahvaltı & atıştırma",items:[{name:"Serpme Kahvaltı",desc:"2 kişilik",price:"650"},{name:"Menemen",price:"180"},{name:"Avokado Tost",price:"220"},{name:"Club Sandwich",desc:"patates ile",price:"240"},{name:"Simit & Peynir",price:"120"}]}
    ]
  };
  var DAYS=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
  var STORE="moar-data";
  var $=function(s,r){return (r||document).querySelector(s);};
  function clone(o){return JSON.parse(JSON.stringify(o));}
  function load(){try{var s=localStorage.getItem(STORE);if(s){var d=JSON.parse(s);if(d&&d.config&&d.menu){if(!d.config.adminPass)d.config.adminPass=DEFAULTS.config.adminPass;return d;}}}catch(e){}return clone(DEFAULTS);}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(DATA));flash();return true;}catch(e){return false;}}
  function fmt(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mm=m%60;return (h<10?"0":"")+h+":"+(mm<10?"0":"")+mm;}
  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
  function flash(){var m=$("#savedMsg");m.hidden=false;setTimeout(function(){m.hidden=true;},1600);}
  function labeled(label,value,onInput,isArea){
    var w=el("label","fld");w.appendChild(el("span",null,label));
    var inp=document.createElement(isArea?"textarea":"input");inp.className="inp";inp.value=value==null?"":value;
    inp.addEventListener("input",function(){onInput(inp.value);});w.appendChild(inp);return w;}

  var DATA=load();

  // theme
  var thb=$("#theme");
  try{var th=localStorage.getItem("moar-theme");if(th){document.documentElement.setAttribute("data-theme",th);}}catch(e){}
  thb.addEventListener("click",function(){var cu=document.documentElement.getAttribute("data-theme");var dark=cu?cu==="dark":matchMedia("(prefers-color-scheme: dark)").matches;var next=dark?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("moar-theme",next);}catch(e){}});

  // lock
  $("#go").addEventListener("click",tryIn);
  $("#pass").addEventListener("keydown",function(e){if(e.key==="Enter")tryIn();});
  setTimeout(function(){$("#pass").focus();},60);
  function tryIn(){if(($("#pass").value||"")===(DATA.config.adminPass||"moar1234")){$("#lock").hidden=true;$("#editor").hidden=false;buildEditor();}else{$("#err").hidden=false;}}

  var resetArmed=false;
  function buildEditor(){
    var ed=$("#editor");ed.innerHTML="";var c=DATA.config;

    ed.appendChild(el("div","note","Değişiklikler bu cihazın tarayıcısında saklanır. Herkesin görmesi için “config.json indir” ile dosyayı sitenin klasörüne (index.html yanına) yükleyin. / Saved on this device; publish via config.json."));

    // business
    var biz=el("div","card");biz.appendChild(el("h2","İşletme"));
    biz.appendChild(labeled("Kafe adı",c.brand,function(v){c.brand=v;}));
    var g=el("div","grid2");g.appendChild(labeled("Telefon",c.phone,function(v){c.phone=v;}));g.appendChild(labeled("WhatsApp (rakam)",c.whatsapp,function(v){c.whatsapp=v;}));biz.appendChild(g);
    biz.appendChild(labeled("Google Maps linki",c.mapsUrl,function(v){c.mapsUrl=v;}));
    biz.appendChild(labeled("Para birimi",c.currency,function(v){c.currency=v;}));
    biz.appendChild(labeled("Adres (TR)",c.address.tr,function(v){c.address.tr=v;}));
    biz.appendChild(labeled("Adres (EN)",c.address.en,function(v){c.address.en=v;}));
    biz.appendChild(labeled("Adres (RU)",c.address.ru,function(v){c.address.ru=v;}));
    biz.appendChild(labeled("Yönetici şifresi",c.adminPass,function(v){c.adminPass=v;}));
    ed.appendChild(biz);

    // hours
    var hc=el("div","card");hc.appendChild(el("h2","Çalışma saatleri"));
    var chk=el("label","chk");var cb=document.createElement("input");cb.type="checkbox";cb.checked=!!c.hoursConfirmed;
    cb.addEventListener("change",function(){c.hoursConfirmed=cb.checked;});chk.appendChild(cb);chk.appendChild(el("span",null,"Saatler doğrulandı — durum göster (Açık/Kapalı)"));hc.appendChild(chk);
    [1,2,3,4,5,6,0].forEach(function(day){
      var h=c.hours[day],row=el("div","hrow");row.appendChild(el("span","day",DAYS[day]));
      var o=document.createElement("input");o.type="time";o.className="inp";o.value=h?fmt(h.o):"";
      var cl=document.createElement("input");cl.type="time";cl.className="inp";cl.value=h?(h.c===1440?"00:00":fmt(h.c)):"";
      function toMin(v,isC){if(!v)return null;var p=v.split(":");var m=(+p[0])*60+(+p[1]);if(isC&&m===0)m=1440;return m;}
      function upd(){var oo=toMin(o.value,false),cc=toMin(cl.value,true);if(oo==null||cc==null)c.hours[day]=null;else c.hours[day]={o:oo,c:cc};}
      o.addEventListener("input",upd);cl.addEventListener("input",upd);
      var x=el("button","mini x","Kapalı");x.addEventListener("click",function(){c.hours[day]=null;o.value="";cl.value="";});
      row.appendChild(o);row.appendChild(cl);row.appendChild(x);hc.appendChild(row);});
    ed.appendChild(hc);

    // signature
    var sg=el("div","card");sg.appendChild(el("h2","Öne çıkan ürün"));
    sg.appendChild(labeled("Başlık",DATA.signature.title,function(v){DATA.signature.title=v;}));
    sg.appendChild(labeled("Açıklama",DATA.signature.desc,function(v){DATA.signature.desc=v;},true));
    sg.appendChild(labeled("Fiyat",DATA.signature.price,function(v){DATA.signature.price=v;}));
    ed.appendChild(sg);

    // menu
    var mc=el("div","card");mc.appendChild(el("h2","Menü"));var box=el("div");mc.appendChild(box);
    function drawMenu(){box.innerHTML="";
      DATA.menu.forEach(function(sec,si){var b=el("div","msec");
        var st=el("div","secttl");
        var tI=document.createElement("input");tI.className="inp";tI.value=sec.title;tI.placeholder="Bölüm adı";tI.addEventListener("input",function(){sec.title=tI.value;});
        var sI=document.createElement("input");sI.className="inp";sI.value=sec.sub||"";sI.placeholder="alt başlık";sI.addEventListener("input",function(){sec.sub=sI.value;});
        var sx=el("button","mini x","Sil");sx.addEventListener("click",function(){DATA.menu.splice(si,1);drawMenu();});
        st.appendChild(tI);st.appendChild(sI);st.appendChild(sx);b.appendChild(st);
        (sec.items||[]).forEach(function(it,ii){var ir=el("div","irow");
          var n=document.createElement("input");n.className="inp";n.value=it.name||"";n.placeholder="Ürün";n.addEventListener("input",function(){it.name=n.value;});
          var p=document.createElement("input");p.className="inp";p.value=it.price||"";p.placeholder="Fiyat";p.inputMode="decimal";p.addEventListener("input",function(){it.price=p.value;});
          var x=el("button","mini x","✕");x.addEventListener("click",function(){sec.items.splice(ii,1);drawMenu();});
          ir.appendChild(n);ir.appendChild(p);ir.appendChild(x);
          var sub=el("div","sub");
          var d=document.createElement("input");d.className="inp";d.value=it.desc||"";d.placeholder="açıklama (ops.)";d.addEventListener("input",function(){it.desc=d.value;});
          var tg=document.createElement("input");tg.className="inp";tg.value=it.tag||"";tg.placeholder="etiket (ops.)";tg.addEventListener("input",function(){it.tag=tg.value;});
          sub.appendChild(d);sub.appendChild(tg);ir.appendChild(sub);b.appendChild(ir);});
        var add=el("button","mini","+ ürün");add.addEventListener("click",function(){sec.items.push({name:"Yeni ürün",price:"0"});drawMenu();});b.appendChild(add);
        box.appendChild(b);});
      var addS=el("button","abtn","+ Bölüm ekle");addS.addEventListener("click",function(){DATA.menu.push({id:"b"+Date.now(),title:"Yeni Bölüm",sub:"",items:[]});drawMenu();});box.appendChild(addS);}
    drawMenu();ed.appendChild(mc);

    // save/backup
    var bc=el("div","card");bc.appendChild(el("h2","Kaydet & Yedek"));
    var bb=el("div","btns");
    var sv=el("button","abtn go","💾 Kaydet");sv.addEventListener("click",function(){save();});
    var dl=el("button","abtn","⬇ config.json indir");dl.addEventListener("click",function(){try{var bl=new Blob([JSON.stringify(DATA,null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(bl);a.download="config.json";document.body.appendChild(a);a.click();a.remove();}catch(e){}});
    var cp=el("button","abtn","⧉ JSON kopyala");cp.addEventListener("click",function(){var txt=JSON.stringify(DATA,null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){cp.textContent="Kopyalandı ✓";setTimeout(function(){cp.textContent="⧉ JSON kopyala";},1500);},function(){});}});
    var rs=el("button","abtn","↺ Sıfırla");rs.addEventListener("click",function(){if(resetArmed){resetArmed=false;try{localStorage.removeItem(STORE);}catch(e){}DATA=clone(DEFAULTS);buildEditor();return;}resetArmed=true;rs.textContent="↺ Emin? tekrar bas";setTimeout(function(){resetArmed=false;rs.textContent="↺ Sıfırla";},2500);});
    bb.appendChild(sv);bb.appendChild(dl);bb.appendChild(cp);bb.appendChild(rs);bc.appendChild(bb);
    var impL=el("p",null,"İçe aktar — config.json içeriğini yapıştır:");impL.style.cssText="font-size:12px;color:var(--muted);margin:14px 0 4px";bc.appendChild(impL);
    var ta=document.createElement("textarea");ta.className="inp";ta.placeholder='{"config":...}';bc.appendChild(ta);
    var imp=el("button","abtn","⬆ Yükle");imp.style.marginTop="8px";imp.addEventListener("click",function(){try{var d=JSON.parse(ta.value);if(d&&d.config&&d.menu){DATA=d;save();buildEditor();}else{ta.style.borderColor="var(--red)";}}catch(e){ta.style.borderColor="var(--red)";}});
    bc.appendChild(imp);
    ed.appendChild(bc);
  }
})();
</script>
</body>
</html>
